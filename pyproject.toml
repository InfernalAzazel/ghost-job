[project]
name = "ghostjob"
version = "0.1.0"
description = "Ghostjob — Reflex UI + Patchright BOSS scraper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "patchright>=1.63.0",
    "pydantic>=2.0",
    "pyquery>=2.1.0",
    "reflex>=0.9.12",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
