[project]
name = "ghost-job"
version = "0.1.0"
description = "Ghost Job — Reflex UI + Patchright BOSS scraper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "patchright>=1.63.0",
    "pydantic>=2.0",
    "pyquery>=2.1.0",
    "reflex>=0.9.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
