# 发布工作流。**这个文件跑在公有仓库 `ghost-job` 上**，源码在私有仓库 `ghost-job-src`：
# 公开仓库的 Actions 不计费，所以构建放这边跑，私有代码由 `SRC_TOKEN`（只读）拉取。
#
# 构建和发版交给 Tauri 官方的 `tauri-apps/tauri-action`：四个平台各自构建完，把安装包直接
# 传到同一个 Release，省掉产物在 artifact 里中转的一圈（原来那套是 build → upload-artifact
# → download-artifact → softprops/action-gh-release 五个步骤两个 job）。
#
# 它替不掉的三件事，所以仍然自己写，改动时留意：
#   - 取私有源码：它不认识私库，`SRC_TOKEN` 这步得留
#   - 从 tag 写版本号：它的 `__VERSION__` 是拿项目版本号去替换 tag 名，方向是反的
#   - 更新日志：在私有仓库里，读出来塞进 `releaseBody`
#
# 后端是 Python（`src-python/`），由 `tauri.conf.json` 的 beforeBuildCommand 调
# `uv run tauri-runtime build` 用 Nuitka 编成独立二进制，再作为 resources 打进安装包。所以每个
# 平台除了 Node/Rust 还要有 uv 和 C 编译器：macOS/Windows runner 自带 clang/MSVC，Linux 自带
# gcc，但 Nuitka 的 standalone 在 Linux 上还要 `patchelf`。Python 版本钉在 3.12，与本地一致。
#
# 应用内自动更新用 Tauri 自带的 updater：`createUpdaterArtifacts` 让每个平台额外产出带签名的
# 更新包（macOS 的 .app.tar.gz、Windows 的 -setup.exe/.msi、Linux 的 .AppImage，各配一个 .sig），
# tauri-action 把四个腿的更新包汇总成 Release 里的 `latest.json`，应用从
# `releases/latest/download/latest.json` 取。末尾的 `finalize` job 核对它确实生成了。
#
# 维护方式：源码真相是本文件，存在私有仓库 `ghost-job-src/.github/release-workflow.yml`，
# 改完用 `scripts/release.sh` 复制到公有仓库 `.github/workflows/` 下运行；别直接在公有仓库改，
# 下次同步会被覆盖。
#
# action 版本钉在「恰好切到 node24 的最低主版本」，不追最新：node20 已被 runner 强制换运行时并逐
# job 告警（2025-09-19 的 deprecation，github.blog/changelog），但升主版本可能改行为，取最低的
# 那个风险最小。当前 checkout / setup-node / pnpm-action-setup 为 v5，upload-artifact 为 v6
# ——upload-artifact 的 v5 仍是 node20，必须 v6；setup-uv 为 v7（v6 仍是 node20）。改这几个版本后，正式发版前先
# `scripts/release.sh <版本> --rehearse` 把四个平台验一遍。
#
# 为什么在私有仓库里不放在 `.github/workflows/` 下：那里只有公有仓库会跑它（`SRC_TOKEN` 和
# 免费额度都在公有仓库），而放在 `workflows/` 下会让编辑器把它当本仓库的工作流校验，报一堆
# 「Context access might be invalid: SRC_TOKEN」这类假警报（私有仓库里确实没有这个 secret）。
#
# 触发方式只有两种，都需要仓库写权限，外部人无法触发，`SRC_TOKEN` 不会被滥用：
#   - 推送 vX.Y.Z tag：版本号取自 tag，源码取私有仓库的同名 tag（可复现）
#   - Actions 页手动 Run workflow：自己填版本号；`publish` 选 false 则只构建不发版，
#     用来验证四平台产物（尤其 macOS 的 dmg）能不能打出来，产物作为 workflow artifact 留下
#
# 事前准备（公有仓库 Settings）：
#   - Secrets 加 `SRC_TOKEN`：细粒度 PAT，只授 `ghost-job-src` 的 Contents: Read
#   - Secrets 加 `TAURI_SIGNING_PRIVATE_KEY`：更新包签名私钥（`tauri signer generate` 生成的
#     文件内容），对应的公钥写在 tauri.conf.json 的 `plugins.updater.pubkey`；私钥设了密码时
#     再加 `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`。私钥丢了已安装的版本就再也收不到自动更新
#   - 更新日志写在私有仓库 `.github/release-notes/vX.Y.Z.md`，没有就只发一行下载提示

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v，如 0.7.1）
        required: true
      source_ref:
        description: ghost-job-src 的 ref（tag/分支/commit）；留空则用触发的 ref
        required: false
        default: ""
      publish:
        description: 创建 Release 并上传安装包；关掉则只构建（用来验证产物）
        type: boolean
        default: true

permissions:
  contents: write

# 发布不互相取消：构建到一半被取消会浪费一次四平台构建
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: InfernalAzazel/ghost-job-src
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 无 FUSE 的 runner 上，AppImage 依赖的 linuxdeploy 要这样跑
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 给末尾的 finalize job 用。四个腿算出来的取值相同（同一份输入算的），矩阵 job 的
    # output 取先跑完那个腿的，所以确定
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个平台各自原生构建，不传 --target，产物就都落在 target/release/bundle 下
          - name: linux-x86_64
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
          - name: macos-aarch64
            os: macos-latest
            # dmg 由 Tauri 自带的打包器产出；不稳的话见下面的 retryAttempts
            bundles: app,dmg
          - name: macos-x86_64
            os: macos-15-intel
            bundles: app,dmg
          - name: windows-x86_64
            os: windows-latest
            bundles: msi,nsis
    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve version
        id: resolve
        # 输入用 env 传，不拼进脚本，免得版本号里的字符被 shell 解释
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号 '$version' 不是合法 semver"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

          # tag 推送一定发版；手动触发看 publish 输入
          publish="false"
          if [[ "$EVENT_NAME" == "push" || "$INPUT_PUBLISH" == "true" ]]; then
            publish="true"
          fi

          # 发版与否、Release 的 tag 和标题都走 step output：后面的表达式读
          # steps.resolve.outputs.*，是静态可校验的引用；写进 $GITHUB_ENV 再读 env.* 的话，
          # IDE 的 actions 插件和 actionlint 都看不出这些变量存在。
          # APP_VERSION 例外，它只在 shell 里用，走 $GITHUB_ENV 是标准做法。
          {
            echo "publish=$publish"
            echo "release_tag=v$version"
            echo "release_name=Ghost Job v$version"
          } >> "$GITHUB_OUTPUT"

          echo "本次构建版本：$version"
          echo "是否发版：$publish"

      - name: Check out source (private)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_ref || github.ref_name }}
          token: ${{ secrets.SRC_TOKEN }}
          path: src
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm patchelf

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: src/src-python/uv.lock

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri -> target
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: Apply version
        working-directory: src
        run: node .github/scripts/set-version.mjs "$APP_VERSION"

      - name: Assert the injected version
        # 界面显示和新版本提醒比对的都是它，注入失败必须当场发现——所以放在构建前，
        # 而不是像以前那样等四十分钟构建完再验产物
        working-directory: src
        run: |
          set -euo pipefail
          # [package] 的 version 顶格，依赖的版本都是缩进的，整行匹配不会误伤
          grep -qxF "version = \"${APP_VERSION}\"" src-tauri/Cargo.toml
          grep -qxF "version = \"${APP_VERSION}\"" src-python/pyproject.toml
          # 两个 JSON 用 node 读，避免在依赖的版本号里碰到巧合的同名值
          node -e '
            const want = process.argv[1];
            const fs = require("node:fs");
            for (const file of ["src-tauri/tauri.conf.json", "package.json"]) {
              const got = JSON.parse(fs.readFileSync(file, "utf8")).version;
              if (got !== want) {
                console.error(`::error::${file} 的版本是 ${got}，期望 ${want}`);
                process.exit(1);
              }
            }
          ' "$APP_VERSION"
          echo "各处版本号都是 ${APP_VERSION}"

      - name: Install backend dependencies
        # 在写版本号之后装：set-version 会改 uv.lock 里本项目的版本。--locked 让 lock 与
        # pyproject 不一致时当场失败，而不是构建时悄悄重新解析依赖
        working-directory: src/src-python
        run: uv sync --locked

      - name: Assert the signing key
        # 没有私钥时 createUpdaterArtifacts 会让构建在最后一步才失败，这里提前挡住
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::公有仓库缺少 secret TAURI_SIGNING_PRIVATE_KEY（更新包签名私钥）"
            exit 1
          fi

      - name: Stage release notes
        id: notes
        working-directory: src
        run: |
          set -euo pipefail
          notes=".github/release-notes/v${APP_VERSION}.md"
          {
            echo "下载与你系统对应的安装包即可使用；运行前请确保已安装 Google Chrome。"
            if [[ -f "$notes" ]]; then
              echo
              cat "$notes"
            fi
          } > release-notes.md
          # Release 正文是多行，用 heredoc 塞进 step output 给 tauri-action 用
          {
            echo "body<<RELEASE_BODY_EOF"
            cat release-notes.md
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
          cat release-notes.md

      # 下面两个分支只差四个输入：发版那个要 tagName/releaseName 才会创建 Release，
      # 演练那个三个都不传（官方文档说这样就是"只构建"）。改动时两边都要动。
      - name: Build and publish
        if: steps.resolve.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ steps.resolve.outputs.release_tag }}
          releaseName: ${{ steps.resolve.outputs.release_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # 非 draft、非 prerelease 才会被 `releases/latest` 指到，新版本提醒和自动更新都靠它
          releaseDraft: false
          prerelease: false
          # 汇总各平台更新包生成 latest.json；Windows 同时有 msi 和 nsis，自动更新用 nsis
          # （下载页最常用的就是 -setup.exe）
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          # 不设 assetNamePattern：产物名就走 productName 推导的默认形状
          # （Ghost Job_0.7.1_aarch64.dmg、Ghost Job_0.7.1_x64-setup.exe、
          # Ghost Job-0.7.1-1.x86_64.rpm 这一族），与 v0.7.0 的历史产物同形。
          # 之前设成 ghost-job_[version]_[arch][_setup].[ext] 会把连字符换成下划线，
          # 让下载名跟历史断代

      - name: Build only (rehearsal)
        if: steps.resolve.outputs.publish != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Upload installers (rehearsal)
        # 不发版时 tauri-action 只把产物留在磁盘上（它的 tagName/releaseName/releaseId
        # 都不传就不会创建 Release），所以用官方的 upload-artifact 收走，好下载下来验证
        if: steps.resolve.outputs.publish != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ghost-job-${{ matrix.name }}
          path: |
            src/src-tauri/target/release/bundle/**/*.dmg
            src/src-tauri/target/release/bundle/**/*.msi
            src/src-tauri/target/release/bundle/**/*.exe
            src/src-tauri/target/release/bundle/**/*.AppImage
            src/src-tauri/target/release/bundle/**/*.deb
            src/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
          retention-days: 7

      - name: Ensure release notes
        # tauri-action 只负责把安装包传进 Release；正文如果要被它之外的路径创建过（比如上次
        # 失败留下的空 Release，标题和正文是 tag 注解），这里按私有仓库里的更新日志覆盖一次，
        # 保证正文只有一个来源。幂等，正常发布时是空操作。跑在 Linux 腿上一遍就够。
        if: steps.resolve.outputs.publish == 'true' && matrix.name == 'linux-x86_64'
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 从 output 传进来，这一步就是自包含的，不用回头猜哪个 env 是谁写的
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.resolve.outputs.release_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --repo 必须显式给：这一步的 cwd 是私有源码的 checkout，gh 会照它的 origin
          # 推成 ghost-job-src，然后去那里找 Release——私有仓库没有 Release，报 release not found
          gh release edit "$RELEASE_TAG" --repo "$REPO" --title "$RELEASE_NAME" --notes-file release-notes.md
          echo "已把 ${RELEASE_TAG} 的标题和正文对齐到更新日志"

      - name: Assert the bundle name
        # 断言挡在发版前：productName 一旦被写回 ghost-job，macOS 装出来就是 ghost-job.app，
        # 用户的旧版 "Ghost Job.app" 不会被覆盖，桌面上会并排出现两个应用；Windows 那边同一个
        # 名字还决定安装目录和推导出来的 WiX 升级码，改了就从"覆盖升级"变成"并存安装"。
        # 旧版（v0.7.0 及更早）用的就是 "Ghost Job"，包内可执行文件叫 ghost-job。
        if: runner.os == 'macOS'
        working-directory: src
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle/macos
          app="$bundle/Ghost Job.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::没找到 'Ghost Job.app'，实际产物："
            ls -1 "$bundle" || true
            exit 1
          fi
          # 两个名字来源不同：CFBundleName 跟着 productName，可执行文件名跟着 mainBinaryName
          name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          echo "CFBundleName     = $name"
          echo "CFBundleExecutable = $exe"
          [[ "$name" == "Ghost Job" ]] \
            || { echo "::error::CFBundleName 是 '$name'，期望 'Ghost Job'（见 tauri.conf.json 的 productName）"; exit 1; }
          [[ "$exe" == "ghost-job" ]] \
            || { echo "::error::CFBundleExecutable 是 '$exe'，期望 'ghost-job'（见 tauri.conf.json 的 mainBinaryName）"; exit 1; }
          ls -1 "$app/Contents/MacOS/"
          # 只有链接器签名、没有整包签名的 .app 在 Apple Silicon 上会被报「已损坏」且无法放行（v1.5.0）
          codesign --verify --deep --strict "$app" \
            || { echo "::error::'Ghost Job.app' 没有完整签名，检查 tauri.conf.json 的 bundle.macOS.signingIdentity 是否为 \"-\""; exit 1; }
          codesign -dvvv "$app" 2>&1 | grep -E '^(Signature|Sealed Resources)'

      - name: List installers
        # 无论成功失败都列一遍，dmg 有没有打出来一眼能看到
        if: always()
        working-directory: src
        run: |
          echo "== 打包产物 =="
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec ls -lh {} \; | sed 's/^/  /' || true

  finalize:
    # 四个腿都传完后核对自动更新要用的 latest.json 和各平台签名都在，再列出最终产物
    needs: build
    if: needs.build.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          # 没有 checkout，gh 推不出仓库，所以 --repo 显式给
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern latest.json --output latest.json \
            || { echo "::error::$RELEASE_TAG 没有 latest.json，已安装的版本收不到自动更新"; exit 1; }
          cat latest.json
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].signature | length > 0' latest.json > /dev/null \
              || { echo "::error::latest.json 缺少 $platform 的更新包或签名"; exit 1; }
          done
          echo "== $RELEASE_TAG 最终产物 =="
          gh release view "$RELEASE_TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | "  \(.name)"'
